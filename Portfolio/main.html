<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ugesh Ragavan — Portfolio Gateway. Select your experience: Engineer or Creator.">
  <title>Ugesh Ragavan // Portfolio Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Fira+Code:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <style>
    /* Sleek Creative Header & Navigation */
    .gateway-header {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    .gateway-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #06b6d4;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .gateway-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .gateway-title span {
      background: linear-gradient(135deg, #06b6d4 0%, #39ff14 50%, #ff7b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gateway-subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-top: 8px;
      font-weight: 500;
    }

    .gateway-footer {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
    }

    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      padding: 12px 26px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .back-home-btn:hover {
      color: #ffffff;
      border-color: #00d2ff;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      transform: translateY(-2px);
    }

    a.card-link {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>

<body>

  <!-- Ambient Glow Orbs -->
  <div class="bg-orb orb-cyan"></div>
  <div class="bg-orb orb-pink"></div>
  <div class="bg-grid"></div>

  <header class="gateway-header">
    <div class="gateway-badge">✨ PORTFOLIO SELECT</div>
    <h1 class="gateway-title">Welcome to <span>World of Ugesh</span></h1>
    <p class="gateway-subtitle">Choose your experience mode to get started</p>
  </header>

  <!-- 1. Engineer Class Option -->
  <a href="Engineer.html" class="card-link" title="Enter Engineer Portfolio">
    <figure class="card-engineer">
      <img src="../images/Engineer.png" alt="Engineer Class">
      <figcaption>
        <span class="fig-title">ENGINEER</span>
        <span class="fig-desc">Pyspark, Bigdata and GenAI</span>
      </figcaption>
    </figure>
  </a>

  <!-- 2. Creator Class Option -->
  <a href="Creator.html" class="card-link" title="Enter Creator Portfolio">
    <figure class="card-creator">
      <img src="../images/Creator.png" alt="Creator Class">
      <figcaption>
        <span class="fig-title">CREATOR</span>
        <span class="fig-desc">Filming, Creating and Documenting</span>
      </figcaption>
    </figure>
  </a>

  <footer class="gateway-footer">
    <a href="../index.html" class="back-home-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back to Bio Links
    </a>
  </footer>

</body>

</html>
