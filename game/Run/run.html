<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run – Endless Runner Game</title>
  <meta name="description" content="3D endless runner game built with Three.js. Click to jump, grab carrots and avoid hedgehogs!" />
  <link rel="stylesheet" href="run.css" />
</head>
<body>
  <div id="world"></div>

  <div id="gameoverInstructions">Game Over</div>

  <div id="dist">
    <div class="label">distance</div>
    <div id="distValue">000</div>
  </div>

  <div id="instructions">
    Click to jump<span class="lightInstructions"> — Grab the carrots / avoid the hedgehogs</span>
  </div>

  <!-- Three.js r71 (matches the API used in run.js: CubeGeometry, FlatShading, etc.) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
  <!-- TweenMax (GreenSock) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

  <script src="run.js"></script>
</body>
</html>
