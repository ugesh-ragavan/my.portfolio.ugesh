    :root {
      --violet-primary: #7c3aed;
      --violet-dark: #200d30;
      --violet-soft: #f3e8ff;
      --violet-accent: #a855f7;
      --gold-glow: #fbbf24;
      --bg-gradient: linear-gradient(180deg, #faf5ff 0%, #f5eefd 30%, #faf6f0 65%, #fdfbf7 100%);
      --card-glass: #fffffff2;
      --card-border: #a855f747;
      --shadow-warm: 0 16px 36px -8px #2d12421f
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--violet-dark);
      -webkit-font-smoothing: antialiased;
      background-attachment: fixed;
      font-family: Plus Jakarta Sans, sans-serif;
      overflow-x: hidden
    }

    .birthday-card {
      background: var(--card-glass);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--shadow-warm);
      border-radius: 26px;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .35s, border-color .3s;
      position: relative
    }

    .birthday-card:hover {
      border-color: #a855f773;
      transform: translateY(-4px)scale(1.01);
      box-shadow: 0 22px 45px -6px #7c3aed38
    }

    .editorial-card {
      -webkit-backdrop-filter: blur(16px);
      background: #fffffff5;
      border: 1.5px solid #d4af3740;
      border-radius: 26px;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .35s;
      position: relative;
      box-shadow: 0 16px 36px -8px #4c1d9514, 0 4px 12px #00000008
    }

    .editorial-card:hover {
      box-shadow: 0 22px 45px -6px #7c3aed29
    }

    .doodle-note {
      color: #713f12;
      background: #fef9c3;
      border: 1px solid #f59e0b4d;
      border-radius: 14px;
      padding: .85rem 1.15rem;
      font-family: Caveat, cursive;
      transform: rotate(-2deg);
      box-shadow: 0 8px 18px #00000014
    }

    .violet-glow-btn {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #a855f7 100%);
      border: 1px solid #ffffff4d;
      border-radius: 9999px;
      font-weight: 600;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      box-shadow: 0 8px 24px #7c3aed59
    }

    .violet-glow-btn:hover {
      transform: translateY(-2px)scale(1.02);
      box-shadow: 0 12px 30px #7c3aed85
    }

    .violet-glow-btn:active {
      transform: scale(.96)
    }

    .btn-squish {
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1)
    }

    .btn-squish:active {
      transform: scale(.96)
    }

    .font-serif {
      font-family: Playfair Display, Cormorant Garamond, Georgia, serif
    }

    .font-handwriting,
    .font-script {
      font-family: Caveat, cursive
    }

    .font-sans-body {
      font-family: Plus Jakarta Sans, sans-serif
    }

    .violet-audio-pill {
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #581c87;
      background: #ffffffe0;
      border: 1.5px solid #a855f759;
      transition: all .25s;
      box-shadow: 0 4px 16px #7c3aed1f
    }

    .violet-audio-pill:hover {
      background: #fffffffa;
      border-color: #7c3aed;
      box-shadow: 0 6px 20px #7c3aed38
    }

    .washi-tape-violet {
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      background: #e9d5ffbf;
      border-top: 1px solid #a855f74d;
      border-bottom: 1px solid #a855f74d;
      position: absolute;
      box-shadow: 0 2px 6px #2d12420d
    }

    .violet-foil-badge {
      background: linear-gradient(135deg, #fffffff2, #f3e8ffd9);
      border: 1.5px solid #a855f759;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px #7c3aed1f
    }

    .violet-foil-badge:after {
      content: "";
      pointer-events: none;
      background: linear-gradient(110deg, #0000 40%, #ffffffb3 50%, #0000 60%);
      width: 200%;
      height: 100%;
      animation: 4.5s ease-in-out infinite foilShimmer;
      position: absolute;
      top: 0;
      left: -100%
    }

    @keyframes foilShimmer {
      0% {
        transform: translate(-100%)
      }

      50%,
      to {
        transform: translate(100%)
      }
    }

    .polaroid-editorial {
      background: #fff;
      border: 1.5px solid #a855f733;
      transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .35s;
      box-shadow: 0 16px 36px -8px #2d12421f, 0 4px 12px #7c3aed0d
    }

    .polaroid-editorial:hover {
      transform: translateY(-5px)scale(1.02);
      box-shadow: 0 22px 46px -8px #7c3aed38
    }

    @keyframes ambientFlicker {

      0%,
      to {
        opacity: .95;
        filter: drop-shadow(0 0 20px #f59e0be6);
        transform: scale(1)rotate(-.5deg)
      }

      30% {
        opacity: 1;
        filter: drop-shadow(0 0 26px #fbbf24);
        transform: scale(1.06, .98)rotate(1deg)
      }

      70% {
        opacity: .92;
        filter: drop-shadow(0 0 18px #f59e0bd9);
        transform: scale(.97, 1.03)rotate(-1deg)
      }
    }

    .animate-candle-flame {
      transform-origin: bottom;
      animation: 2.2s ease-in-out infinite alternate ambientFlicker
    }

    @keyframes smokeRise {
      0% {
        opacity: .7;
        transform: scale(.6)translateY(0)
      }

      60% {
        opacity: .4;
        transform: scale(1.3)translateY(-30px)
      }

      to {
        opacity: 0;
        transform: scale(2)translateY(-65px)
      }
    }

    .animate-smoke {
      animation: 1.8s ease-out forwards smokeRise
    }

    @keyframes cardShake {

      0%,
      to {
        transform: translate(0)
      }

      20%,
      60% {
        transform: translate(-6px)rotate(-1deg)
      }

      40%,
      80% {
        transform: translate(6px)rotate(1deg)
      }
    }

    .animate-card-shake {
      animation: .45s cubic-bezier(.36, .07, .19, .97) both cardShake
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: #faf5ff
    }

    ::-webkit-scrollbar-thumb {
      background: #a855f759;
      border-radius: 9999px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #7c3aed99
    }
